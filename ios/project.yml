name: HeatMind
options:
  bundleIdPrefix: com.heatmind
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "ZL7PN9Y55F"

targets:
  HeatMind:
    type: application
    platform: iOS
    sources:
      - path: HeatMind/Sources
      - path: HeatMind/Resources/Bridge.js
        buildPhase: resources
      # קבצי ה-HTML/PNG (עותק מקומי, מסונכרן מ-app/src/main/assets).
      - path: HeatMind/Resources/web/login.html
        buildPhase: resources
      - path: HeatMind/Resources/web/espConfig.html
        buildPhase: resources
      - path: HeatMind/Resources/web/heatmind_app_icon_512.png
        buildPhase: resources
      - path: HeatMind/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heatmind.app
        INFOPLIST_FILE: HeatMind/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HeatMind/Resources/HeatMind.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
